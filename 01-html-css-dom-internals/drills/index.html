
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElevenLabs - Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #171717;
      background: white;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo {
      margin-top: 60px;
      font-size: 18px;
      font-weight: bold;
      color: black;
    }

    /* Signup form */
    .signup-container {
      width: 360px;
      max-width: calc(100% - 40px);
      margin-top: 155px;
    }

    h2 {
      text-align: center;
      font-size: 24px;
      margin: 0 0 32px;
    }

    button,
    input {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
    }

    .google-btn {
      background: white;
      border: 1px solid #e1e1e1;
      color: #222;
      position: relative;
      font-size: 14px;
    }

    .google-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 21px;
      font-weight: bold;
      color: #4285f4;
    }

    .divider {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 28px 0;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 13px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
    }

    input {
      border: 1px solid #e1e1e1;
      outline: none;
      padding: 0 12px;
      background: white;
    }

    input:focus {
      border-color: #999;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 45px;
    }

    .eye {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 16px;
      color: #777;
      background: none;
      border: none;
      width: auto;
      height: auto;
      padding: 0;
    }

    .signup-btn {
      margin-top: 3px;
      border: none;
      background: #a6a6af;
      color: white;
    }

    .signin {
      text-align: center;
      font-size: 14px;
      margin-top: 18px;
    }

    .signin a,
    .footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* Footer */
    .footer {
      margin-top: auto;
      width: 100%;
      text-align: center;
      background: #fafafa;
      color: #777780;
      font-size: 14px;
      font-weight: 500;
      padding: 27px 15px;
    }

    @media (max-height: 800px) {
      .signup-container {
        margin-top: 90px;
      }

      .logo {
        margin-top: 35px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="logo">IIElevenLabs</div>

    <main class="signup-container">

      <h2>Create an account</h2>

      <button class="google-btn" type="button">
        <span class="google-icon">G</span>
        Sign up with Google
      </button>

      <hr class="divider">

      <form>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="password-wrapper">
            <input
              id="password"
              type="password"
              autocomplete="new-password"
              required
            >

            <button
              class="eye"
              type="button"
              aria-label="Show password"
              onclick="togglePassword()"
            >◉</button>
          </div>
        </div>

        <button class="signup-btn" type="submit">
          Sign up
        </button>
      </form>

      <p class="signin">
        Already registered? <a href="#">Sign in</a>
      </p>

    </main>

    <footer class="footer">
      By continuing, you agree to our
      <a href="#">Terms of Service</a> and
      <a href="#">Privacy Policy</a>.
    </footer>

  </div>

  <script>
    function togglePassword() {
      const password = document.getElementById("password");
      const button = document.querySelector(".eye");

      if (password.type === "password") {
        password.type = "text";
        button.setAttribute("aria-label", "Hide password");
      } else {
        password.type = "password";
        button.setAttribute("aria-label", "Show password");
      }
    }
  </script>

</body>
</html>
